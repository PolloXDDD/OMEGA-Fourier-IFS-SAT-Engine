name: Build paper

on:
  push:
    branches: [main]
    paths:
      - 'P_equals_NP_Holographic_Paper.tex'
      - 'references.bib'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: P_equals_NP_Holographic_Paper.tex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add P_equals_NP_Holographic_Paper.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Rebuild compiled paper"
            git push
          fi
