name: Build paper

on:
  push:
    branches: [main]
    paths:
      - 'P_equals_NP_Holographic_Paper.tex'
      - 'references.bib'
      - 'omega_fourier_ifs_colab.py'
      - 'README.md'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: P_equals_NP_Holographic_Paper.tex

      - name: Build release bundle
        run: |
          zip -j OMEGA-Fourier-IFS-SAT-Engine_release.zip \
            P_equals_NP_Holographic_Paper.pdf \
            P_equals_NP_Holographic_Paper.tex \
            references.bib \
            omega_fourier_ifs_colab.py \
            README.md

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add P_equals_NP_Holographic_Paper.pdf OMEGA-Fourier-IFS-SAT-Engine_release.zip
          if git diff --cached --quiet; then
            echo "Generated artifacts unchanged"
          else
            git commit -m "Rebuild paper and exact release bundle"
            git push
          fi
